<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarvesh Deshpande — Link Card</title>
<meta name="theme-color" content="#0f172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-900:#0f172a;
    --dark-800:#1e293b;
    --dark-700:#334155;
    --dark-500:#64748b;
    --dark-300:#cbd5e1;
    --dark-100:#f1f5f9;
    --primary-300:#67e8f9;
    --primary-400:#22d3ee;
    --primary-500:#06b6d4;
    --primary-600:#0891b2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--dark-900);
    color:var(--dark-100);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ambient glow orbs — matches Projects section treatment */
  .orb{position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; pointer-events:none; z-index:0;}
  .orb1{width:420px; height:420px; background:radial-gradient(circle,rgba(6,182,212,0.25) 0%,transparent 70%); top:-140px; right:-140px; animation:float 13s ease-in-out infinite;}
  .orb2{width:380px; height:380px; background:radial-gradient(circle,rgba(34,211,238,0.16) 0%,transparent 70%); bottom:-140px; left:-140px; animation:float 16s ease-in-out infinite reverse;}
  @keyframes float{0%,100%{transform:translate(0,0);}33%{transform:translate(12px,-18px);}66%{transform:translate(-12px,12px);}}
  @media (prefers-reduced-motion: reduce){.orb{animation:none;}}

  .card{
    position:relative; z-index:1;
    width:100%; max-width:400px;
    background:var(--dark-800);
    border:1px solid rgba(148,163,184,0.08);
    border-radius:24px;
    padding:40px 28px 28px;
    box-shadow:0 24px 64px rgba(0,0,0,.45);
    animation:riseIn .6s cubic-bezier(.23,1,.32,1) both;
  }
  @keyframes riseIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}

  .avatar{
    width:104px; height:104px; margin:0 auto 20px;
    border-radius:50%;
    padding:3px;
    background:linear-gradient(135deg, var(--primary-400), var(--primary-600));
    box-shadow:0 0 0 4px rgba(6,182,212,0.15), 0 12px 30px rgba(6,182,212,0.25);
  }
  .avatar img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:var(--dark-800);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .avatar img:active{transform:scale(.96);}

  .lightbox{
    position:fixed; inset:0; z-index:50;
    background:rgba(15,23,42,0.92);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .lightbox.open{opacity:1; pointer-events:auto;}
  .lightbox img{
    width:min(78vw,360px); height:min(78vw,360px);
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 0 6px rgba(6,182,212,0.18), 0 30px 80px rgba(0,0,0,.6);
    transform:scale(.85);
    transition:transform .3s cubic-bezier(.23,1,.32,1);
  }
  .lightbox.open img{transform:scale(1);}
  .lightbox-close{
    position:absolute; top:24px; right:24px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(148,163,184,0.12); border:1px solid rgba(148,163,184,0.2);
    display:flex; align-items:center; justify-content:center;
    color:var(--dark-100); cursor:pointer;
  }
  .lightbox-close svg{width:18px; height:18px;}

  .name{font-size:1.5rem; font-weight:800; text-align:center; letter-spacing:-.01em; color:#fff;}
  .role{font-size:.9rem; text-align:center; color:var(--primary-300); font-weight:500; margin-top:6px; line-height:1.5;}
  .affil{font-size:.78rem; text-align:center; color:var(--dark-500); margin-top:10px; letter-spacing:.02em;}

  .divider{width:40px; height:2px; background:var(--primary-500); margin:22px auto; border-radius:2px;}

  .links{display:flex; flex-direction:column; gap:10px;}
  .link-btn{
    display:flex; align-items:center; gap:12px;
    padding:13px 16px;
    background:rgba(148,163,184,0.06);
    border:1px solid rgba(148,163,184,0.1);
    border-radius:12px;
    color:var(--dark-100);
    text-decoration:none;
    font-size:.9rem; font-weight:600;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .link-btn:hover{transform:translateY(-2px); border-color:rgba(6,182,212,0.4); background:rgba(6,182,212,0.08);}
  .link-btn svg{flex-shrink:0; color:var(--primary-400); width:20px; height:20px;}
  .link-btn .sub{color:var(--dark-500); font-weight:400; font-size:.78rem; display:block; margin-top:1px;}
  .link-btn .txt{display:flex; flex-direction:column; overflow:hidden;}
  .link-btn .txt span.main{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .primary-cta{
    background:linear-gradient(135deg, var(--primary-500), var(--primary-600));
    border:none; color:#fff; justify-content:center; cursor:pointer; font-family:inherit;
  }
  .primary-cta:hover{transform:translateY(-2px); filter:brightness(1.08); border-color:transparent;}

  .row{display:flex; gap:10px;}
  .row .link-btn{flex:1; justify-content:center;}

  footer{margin-top:22px; text-align:center;}
  .share-btn{
    background:transparent; border:1px solid rgba(148,163,184,0.15); color:var(--dark-300);
    font-family:inherit; font-size:.8rem; font-weight:600; padding:9px 18px; border-radius:999px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:.2s;
  }
  .share-btn:hover{border-color:var(--primary-400); color:var(--primary-300);}
  .share-btn svg{width:15px; height:15px;}

  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--dark-800); border:1px solid rgba(6,182,212,0.3); color:var(--primary-300);
    padding:10px 20px; border-radius:999px; font-size:.82rem; font-weight:600;
    opacity:0; transition:.3s; z-index:10; pointer-events:none; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:380px){
    .card{padding:32px 20px 22px;}
    .name{font-size:1.3rem;}
  }
</style>
</head>

  const lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(){
    lightboxImg.src = avatarImg.src;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  avatarImg.addEventListener('click', openLightbox);
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  document.getElementById('saveContactBtn').addEventListener('click', () => {
    const vcard = [

      'ORG:IIT Madras / KLS Gogte Institute of Technology',

      'TEL;TYPE=CELL:+917483400323',
      'EMAIL:deshpandesarvesh26@gmail.com',
      'URL:https://sarveshdeshpande.page',
      'URL:https://linkedin.com/in/sarvesh-deshpandesd',
      'END:VCARD'
    ].join('\n');
    const blob = new Blob([vcard], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Sarvesh_Deshpande.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Contact card downloaded');
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const shareData = {
      title: 'Sarvesh Deshpande',
      text: 'Mechanical & Electronic Systems Engineering Student — connect with me',
      url: window.location.href
    };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch(e) {}
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast('Link copied to clipboard');
      } catch(e) {
        showToast('Copy this page\'s URL to share');
      }
    }
  });
</script>
